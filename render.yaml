services:
  # FastAPI Backend Web Service
  - type: web
    name: bingo-telegram-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///bingo.db
      - key: BOT_TOKEN
        value: 8990850541:AAGFCIi6qLtQydYp7q4DyHZHqnO-3VrF3pg
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_APP_URL
        sync: false
      - key: REDIS_URL
        sync: false
